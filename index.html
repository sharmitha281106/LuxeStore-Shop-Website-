<title>LuxeFashion | Professional Store</title>
<style>
/* --- CSS VARIABLES & RESET --- */
:root {
--primary: #222222;
--accent: #C5A47E; /* Professional Gold/Beige */
--bg: #ffffff;
--light-bg: #f9f9f9;
--text: #333333;
--border: #e5e5e5;
--shadow: 0 4px 12px rgba(0,0,0,0.05);
--font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background-color: var(--light-bg); color: var(--text); }
a { text-decoration: none; color: inherit; }
ul { list-style: none; }
button { cursor: pointer; font-family: inherit; }
img { display: block; max-width: 100%; object-fit: cover; }

/* --- LAYOUT UTILITIES --- */
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* 4-Column Grid Requirement */
.grid-4 {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 20px;
}

/* Responsive Breakpoints */
@media (max-width: 992px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .grid-4 { grid-template-columns: 1fr; } }

/* --- HEADER & NAV --- */
header { background: var(--bg); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; }
.nav-bar { display: flex; justify-content: space-between; align-items: center; height: 70px; }
.logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -1px; }
.logo span { color: var(--accent); }

.nav-menu { display: flex; gap: 25px; }
.nav-menu a { font-size: 0.9rem; font-weight: 500; text-transform: uppercase; }
.nav-menu a:hover { color: var(--accent); }

.nav-actions { display: flex; gap: 15px; align-items: center; }
.icon-btn { background: none; border: none; font-size: 1.2rem; position: relative; }
.badge {
position: absolute; top: -5px; right: -8px; background: var(--accent);
color: white; font-size: 0.7rem; width: 16px; height: 16px;
border-radius: 50%; display: flex; align-items: center; justify-content: center;
}

/* --- HERO SECTION --- */
.hero {
height: 450px;
background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
background-size: cover; background-position: center;
display: flex; align-items: center; justify-content: center; color: white; text-align: center;
}
.hero h1 { font-size: 3rem; margin-bottom: 15px; font-weight: 300; }
.hero-btn { padding: 12px 30px; background: var(--accent); color: white; border: none; font-weight: bold; margin-top: 20px; }
.hero-btn:hover { background: var(--primary); }

/* --- CATEGORIES (Distinct 4-Column Layout) --- */
.section-title { text-align: center; margin: 50px 0 30px; font-size: 1.8rem; }
.category-col {
position: relative; height: 350px; overflow: hidden; border-radius: 4px; cursor: pointer;
}
.category-col img { width: 100%; height: 100%; transition: transform 0.6s ease; }
.category-col:hover img { transform: scale(1.1); }
.category-overlay {
position: absolute; inset: 0; background: rgba(0,0,0,0.25);
display: flex; align-items: center; justify-content: center; transition: background 0.3s;
}
.category-col:hover .category-overlay { background: rgba(0,0,0,0.15); }
.category-overlay h3 { color: white; font-size: 1.4rem; letter-spacing: 2px; border-bottom: 2px solid var(--accent); }

/* --- PRODUCT CARDS --- */
.product-card { background: white; border-radius: 4px; overflow: hidden; box-shadow: var(--shadow); transition: 0.3s; }
.product-card:hover { transform: translateY(-5px); }
.p-img-container { height: 250px; position: relative; overflow: hidden; }
.p-img-container img { width: 100%; height: 100%; }
.p-info { padding: 15px; text-align: center; }
.p-cat { font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
.p-brand { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 3px; }
.p-name { font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
.p-price { color: var(--primary); font-weight: bold; }
.p-off { color: var(--accent); font-size: 0.8rem; font-weight: 600; margin-left: 5px; }
.add-btn {
width: 100%; padding: 10px; background: var(--primary); color: white;
border: none; margin-top: 10px; display: none;
}
.product-card:hover .add-btn { display: block; }

/* --- AUTH FORMS (Login/Register) --- */
.auth-box {
max-width: 400px; margin: 60px auto; background: white;
padding: 40px; box-shadow: var(--shadow); text-align: center;
}
.form-group { margin-bottom: 20px; text-align: left; }
.form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: bold; }
.form-group input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
.auth-btn { width: 100%; padding: 12px; background: var(--primary); color: white; font-weight: bold; border: none; }
.switch-link { margin-top: 15px; font-size: 0.9rem; }
.switch-link span { color: var(--accent); cursor: pointer; font-weight: bold; }

/* --- SETTINGS PAGE --- */
.settings-container { max-width: 800px; margin: 50px auto; display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
.profile-card { background: white; padding: 30px; box-shadow: var(--shadow); text-align: center; border-radius: 4px; }
.profile-pic { width: 100px; height: 100px; border-radius: 50%; background: #eee; margin: 0 auto 15px; object-fit: cover; }
.settings-nav { text-align: left; margin-top: 20px; }
.settings-nav div { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
.settings-nav div:hover { background: var(--light-bg); color: var(--accent); }
.settings-content { background: white; padding: 30px; box-shadow: var(--shadow); border-radius: 4px; }

/* --- TOAST --- */
#toast { visibility: hidden; min-width: 250px; background: #333; color: #fff; text-align: center; border-radius: 4px; padding: 16px; position: fixed; z-index: 2000; right: 30px; bottom: 30px; font-size: 14px; }
#toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
@keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
@keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
</style>
</head>

const app = {
state: {
user: null, // Stores user info if logged in
cart: [],
filter: 'All'
},

// Router: Switches Views
router: function(view, param = null) {
const main = document.getElementById('app');
window.scrollTo(0,0);
this.updateAuthUI(); // Refresh header buttons

if (view === 'home') this.renderHome(main);
else if (view === 'shop') {
if(param) this.state.filter = param;
this.renderShop(main);
}
else if (view === 'cart') this.renderCart(main);
else if (view === 'login') this.renderLogin(main);
else if (view === 'register') this.renderRegister(main);
else if (view === 'settings') this.renderSettings(main);
else if (view === 'checkout') this.renderCheckout(main);
},

// Auth Actions
login: function(e) {
e.preventDefault();
this.state.user = {
name: "Alex User",
email: document.getElementById('log-email').value,
avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80"
};
this.showToast("Successfully Logged In");
this.router('home');
},

register: function(e) {
e.preventDefault();
this.state.user = {
name: document.getElementById('reg-name').value,
email: document.getElementById('reg-email').value,
avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80"
};
this.showToast("Account Created");
this.router('home');
},

logout: function() {
this.state.user = null;
this.showToast("Logged Out");
this.router('home');
},

updateAuthUI: function() {
const div = document.getElementById('user-auth-btn');
if (this.state.user) {
div.innerHTML = `
<button onclick="app.router('settings')" style="background:none; border:none; display:flex; align-items:center; gap:5px; font-weight:bold;">
<img src="${this.state.user.avatar}" style="width:30px; height:30px; border-radius:50%;">
<span>Account</span>
</button>
`;
} else {
div.innerHTML = `<button class="auth-btn" style="padding: 8px 15px; font-size:0.8rem;" onclick="app.router('login')">Login</button>`;
}
},

// Cart Actions
addToCart: function(id) {
const product = products.find(p => p.id === id);
const exists = this.state.cart.find(c => c.id === id);
if(exists) exists.qty++;
else this.state.cart.push({...product, qty: 1});

document.getElementById('cart-badge').innerText = this.state.cart.reduce((a,b)=>a+b.qty,0);
this.showToast("Added to Cart");
},

// Render Views
renderHome: function(container) {
container.innerHTML = `
<section class="hero">
<div>
<h1>Refined Elegance</h1>
<button class="hero-btn" onclick="app.router('shop')">Explore Collection</button>
</div>
</section>

<!-- 4-Column Category Grid -->
<div class="container">
<h2 class="section-title">Browse Categories</h2>
<div class="grid-4">
<div class="category-col" onclick="app.router('shop', 'Apparel')">
<img src="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Apparel">
<div class="category-overlay"><h3>APPAREL</h3></div>
</div>
<div class="category-col" onclick="app.router('shop', 'Accessories')">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Accessories">
<div class="category-overlay"><h3>ACCESSORIES</h3></div>
</div>
<div class="category-col" onclick="app.router('shop', 'Lifestyle')">
<img src="https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Lifestyle">
<div class="category-overlay"><h3>LIFESTYLE</h3></div>
</div>
<div class="category-col" onclick="app.router('shop', 'Makeup Kits')">
<img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="Makeup">
<div class="category-overlay"><h3>MAKEUP KITS</h3></div>
</div>
</div>
</div>

<div class="container">
<h2 class="section-title">New Arrivals</h2>
<div class="grid-4">
${products.slice(0, 4).map(p => this.createCard(p)).join('')}
</div>
</div>
`;
},

renderShop: function(container) {
const filtered = this.state.filter === 'All' ? products : products.filter(p => p.cat === this.state.filter);

// Create Filter Buttons
const categories = ['All', 'Apparel', 'Accessories', 'Lifestyle', 'Makeup Kits'];
const filtersHTML = categories.map(cat =>
`<button onclick="app.state.filter='${cat}'; app.router('shop')" style="padding:8px 16px; margin:5px; border:1px solid #ddd; background:${this.state.filter===cat?'#222':'white'}; color:${this.state.filter===cat?'white':'#222'}; border-radius:20px;">${cat}</button>`
).join('');

container.innerHTML = `
<div class="container" style="padding-top:40px;">
<div style="text-align:center; margin-bottom:30px;">
<h2>${this.state.filter} Collection</h2>
<div style="margin-top:20px;">${filtersHTML}</div>
</div>
<div class="grid-4">
${filtered.map(p => this.createCard(p)).join('')}
</div>
</div>
`;
},

createCard: function(p) {
return `
<div class="product-card">
<div class="p-img-container">
<img src="${p.img}" alt="${p.desc}">
</div>
<div class="p-info">
<div class="p-cat">${p.cat}</div>
<div class="p-brand">${p.brand}</div>
<div class="p-name">${p.desc}</div>
<div style="display:flex; justify-content:center; align-items:center; gap:5px;">
<div class="p-price">₹${p.price}</div>
<div class="p-off">${p.off}</div>
</div>
<button class="add-btn" onclick="app.addToCart(${p.id})">ADD TO CART</button>
</div>
</div>
`;
},

renderLogin: function(c) {
c.innerHTML = `
<div class="auth-box">
<h2 style="margin-bottom:20px;">Login</h2>
<form onsubmit="app.login(event)">
<div class="form-group"><label>Email</label><input type="email" id="log-email" required></div>
<div class="form-group"><label>Password</label><input type="password" required></div>
<button type="submit" class="auth-btn">LOGIN</button>
</form>
<div class="switch-link">New here? <span onclick="app.router('register')">Create Account</span></div>
</div>
`;
},

renderRegister: function(c) {
c.innerHTML = `
<div class="auth-box">
<h2 style="margin-bottom:20px;">Register</h2>
<form onsubmit="app.register(event)">
<div class="form-group"><label>Full Name</label><input type="text" id="reg-name" required></div>
<div class="form-group"><label>Email</label><input type="email" id="reg-email" required></div>
<div class="form-group"><label>Password</label><input type="password" required></div>
<button type="submit" class="auth-btn">REGISTER</button>
</form>
<div class="switch-link">Already have account? <span onclick="app.router('login')">Login</span></div>
</div>
`;
},

renderSettings: function(c) {
if(!this.state.user) return app.router('login');
c.innerHTML = `
<div class="container">
<h2 class="section-title" style="text-align:left;">My Account</h2>
<div class="settings-container">
<div class="profile-card">
<img src="${this.state.user.avatar}" class="profile-pic">
<h3>${this.state.user.name}</h3>
<p style="color:#888;">${this.state.user.email}</p>
<div class="settings-nav">
<div onclick="alert('Profile Settings')">Profile Settings</div>
<div onclick="alert('Order History')">Order History</div>
<div onclick="app.logout()" style="color:red;">Logout</div>
</div>
</div>
<div class="settings-content">
<h3>Account Settings</h3>
<p style="color:#888; margin:10px 0 20px;">Manage your account details and preferences.</p>
<div class="form-group"><label>Full Name</label><input type="text" value="${this.state.user.name}"></div>
<div class="form-group"><label>Email</label><input type="text" value="${this.state.user.email}" disabled></div>
<div class="form-group"><label>New Password</label><input type="password"></div>
<button class="auth-btn" onclick="app.showToast('Settings Saved')">Save Changes</button>
</div>
</div>
</div>
`;
},

renderCart: function(c) {
if(this.state.cart.length === 0) return c.innerHTML = `<div class="container" style="text-align:center; padding:50px;"><h3>Your Cart is Empty</h3></div>`;
const total = this.state.cart.reduce((a,b)=>a+(b.price*b.qty),0);
c.innerHTML = `
<div class="container" style="padding-top:50px;">
<h2>Shopping Cart</h2>
<div style="background:white; padding:20px; margin-top:20px; box-shadow:var(--shadow);">
${this.state.cart.map(item => `
<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding:15px 0;">
<div style="display:flex; align-items:center; gap:15px;">
<img src="${item.img}" style="width:50px; height:50px; border-radius:4px;">
<b>${item.brand} ${item.desc}</b>
</div>
<div>${item.qty} x ₹${item.price}</div>
</div>
`).join('')}
<div style="text-align:right; margin-top:20px; font-size:1.2rem; font-weight:bold;">
Total: ₹${total}
</div>
<div style="text-align:right; margin-top:10px;">
<button class="auth-btn" onclick="app.router('checkout')">Checkout</button>
</div>
</div>
</div>
`;
},

renderCheckout: function(c) {
if(!this.state.user) { this.showToast("Please Login First"); return this.router('login'); }
c.innerHTML = `
<div class="container" style="padding-top:50px;">
<h2>Secure Checkout</h2>
<div class="auth-box" style="margin:30px auto; text-align:left;">
<div class="form-group"><label>Shipping Address</label><input type="text" placeholder="Street Address"></div>
<div class="form-group"><label>City</label><input type="text"></div>
<button class="auth-btn" onclick="app.state.cart=[]; document.getElementById('cart-badge').innerText=0; app.showToast('Order Placed!'); app.router('home');">Pay & Place Order</button>
</div>
</div>
`;
},

showToast: function(msg) {
const t = document.getElementById("toast");
t.innerText = msg;
t.className = "show";
setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
}
};

// Initialize
app.router('home');
</script>
</body>
</html>
